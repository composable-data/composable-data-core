# ============================================================
# .github/workflows/verify-py-versions.yml (ALL-PY-SRC-PYPI-REPOS)
# ============================================================
# Updated: 2026-08-16
#
# WHY: Validate that the Python package is compatible with supported Python versions.
# REQ: Reusable by PyPI package repositories.

name: Verify Python Versions

on:
  push:
  pull_request:

permissions: # WHY: Use least privileges required.
  contents: read

env:
  PYTHONUNBUFFERED: "1"       # WHY: Real-time logging.
  PYTHONIOENCODING: "utf-8"   # WHY: Ensure UTF-8 encoding.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # WHY: Prevent hanging jobs.

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      # ============================================================
      # A) ASSEMBLE: Checkout code and set up environment
      # ============================================================

      - name: A1) Checkout repository
        uses: actions/checkout@v7

      - name: A2) Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: A3) Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: A4) Display versions
        run: |
          uv --version
          uv run --python ${{ matrix.python-version }} python --version

      - name: A5) Sync project for Python ${{ matrix.python-version }}
        run: uv sync --frozen --python ${{ matrix.python-version }}
        # WHY: Test the matrix-selected Python version, not the repo's
        # default .python-version interpreter.

      # ============================================================
      # B) BASELINE CHECKS: Verify package compatibility
      # ============================================================

      - name: B1) Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} python -m pytest
